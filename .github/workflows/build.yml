name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 仅打包 Windows x64 安装包 (x64-setup.exe / NSIS)
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          # 仅打包 macOS aarch64 磁盘镜像 (aarch64.dmg)
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2.9.1
        with:
          workspaces: src-tauri -> target

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.8
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri app (含签名)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'ADM v__VERSION__'
          releaseDraft: false
          prerelease: false
          # Windows: signCommand 在构建过程中自动签名主程序和 NSIS 安装包
          # macOS: 构建后在下方步骤自签名
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Windows 验证签名
        if: matrix.platform == 'windows-latest'
        shell: powershell
        run: |
          Write-Host "=== 验证 Windows 签名 ===" -ForegroundColor Cyan
          $Target = "${{ matrix.target }}"
          $Files = @()

          # 主程序
          $Exe = "src-tauri\target\$Target\release\ADM.exe"
          if (Test-Path $Exe) { $Files += $Exe }

          # NSIS 安装包
          $Nsis = Get-ChildItem -Path "src-tauri\target\$Target\release\bundle\nsis" -Filter "*-setup.exe" -ErrorAction SilentlyContinue
          if ($Nsis) { $Files += $Nsis.FullName }

          if ($Files.Count -eq 0) {
            Write-Warning "未找到构建产物"
            exit 0
          }

          foreach ($f in $Files) {
            $Sig = Get-AuthenticodeSignature -FilePath $f
            $Color = if ($Sig.Status -eq "Valid") { "Green" } else { "Red" }
            Write-Host "  $($Sig.Status) - $(Split-Path $f -Leaf)" -ForegroundColor $Color
            if ($Sig.SignerCertificate) {
              Write-Host "    证书: $($Sig.SignerCertificate.Subject)" -ForegroundColor Gray
            }
          }

      - name: macOS 自签名
        if: matrix.platform == 'macos-latest'
        run: |
          # 使用正确的 target 路径
          APP_PATH=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/macos" -name "*.app" -type d 2>/dev/null | head -n 1)
          if [ -z "$APP_PATH" ]; then
            # 回退到默认 release 目录
            APP_PATH=$(find "src-tauri/target/release/bundle/macos" -name "*.app" -type d 2>/dev/null | head -n 1)
          fi
          if [ -n "$APP_PATH" ]; then
            echo "对应用进行自签名: $APP_PATH"

            echo "1. 深度清理隔离属性..."
            xattr -cr "$APP_PATH"

            echo "2. 签名所有可执行文件..."
            find "$APP_PATH" -type f -perm +111 -exec codesign --force --sign - --entitlements src-tauri/entitlements.plist {} \; 2>/dev/null

            echo "3. 主程序签名（启用 runtime）..."
            codesign --force --deep --sign - --entitlements src-tauri/entitlements.plist --options runtime "$APP_PATH"

            echo "4. 再次清理隔离属性..."
            xattr -cr "$APP_PATH"

            echo "5. 验证签名..."
            codesign -vvv "$APP_PATH"
          else
            echo "警告: 未找到 .app 包"
          fi
